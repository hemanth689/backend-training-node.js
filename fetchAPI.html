<!-- fetch API is used to fetch the data from file or url. while using the fetch API we have to use promises or async/await.
    Because we are performing asynchronous operation.
    await keyword can be used in async function. await is used to wait till the data is fetched. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch</title>
</head>
<body>
    <h1>Fetching Data ....</h1>
    <div id="demo"></div>
    <script>
        let totalData = "";             //without initialization we will get undefined.
        async function fetchData()
        {
            const data = await fetch("https://api.github.com/users/hadley/orgs");       //it will fetch the raw data.
            const result = await data.json();                                           //it will convert it into json format
            //now result has multiple objects. And we can access easily.
            result.forEach(record => {
                totalData+=`<p>Organization Name : ${record.login}</p>`;
                totalData+=`<p>Organization URL : ${record.url}</p>`;
                totalData+=`<p>Description : ${record.description || 'No description available'}</p><br>`;  //if the description is not available it takes the string.
            });
            //Stored all the data into totalData variable and assign it to div element inorder to display in the browser.
            document.getElementById("demo").innerHTML = totalData;
        }
        fetchData();
    </script>
</body>
</html>
