<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON</title>
</head>
<body>
    <h1>Fetching the data from JSON file using XMLHttpRequest</h1>
    <p id="demo"></p>
    <script>
        const request = new XMLHttpRequest();
        request.onload = function()
        {
            //convert it into JS Object because everytime when we get the data from server it will be in string format.
            const data = JSON.parse(this.responseText);    
            document.getElementById("demo").innerHTML = data[0].id+" "+data[0].name+" "+data[0].email;
        }
        request.open("GET", "https://jsonplaceholder.typicode.com/users/" );
        request.send();
    </script>
</body>
</html>
