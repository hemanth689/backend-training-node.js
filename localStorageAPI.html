<!-- 
    localStorage API is used to store the data. The data will not be deleted even if the browser is closed.
    And also data will be available for days, weeks and years.
    setItem method is used to set the value, here name is reference.
    If we want to display the data in the localStorage use getItem(reference).
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localStorage API</title>
</head>
<body>
    <h3>Enter your details:</h3>

    <label for="fname">First Name:</label>
    <input type="text" id="fname" placeholder="Enter first name"><br><br>

    <label for="lname">Last Name:</label>
    <input type="text" id="lname" placeholder="Enter last name"><br><br>

    <label for="age">Age:</label>
    <input type="number" id="age" placeholder="Enter age"><br><br>

    <label for="address">Address:</label>
    <input type="text" id="address" placeholder="Enter address"><br><br>

    <button onclick="saveData()">Save Data</button><br>
    <p id="demo1"></p>
    <p id="demo2"></p>
    <p id="demo3"></p>
    <p id="demo4"></p>
    <script>
        function saveData()
        {
            const fname = document.getElementById("fname").value;
            const lname = document.getElementById("lname").value;
            const age = document.getElementById("age").value;
            const address = document.getElementById("address").value;
            //storing data
            localStorage.setItem("fname",fname);
            localStorage.setItem("lname", lname);
            localStorage.setItem("age", age);
            localStorage.setItem("address", address);
            //Accessing the data
            document.getElementById("demo1").innerHTML = localStorage.getItem("fname");
            document.getElementById("demo2").innerHTML = localStorage.getItem("lname");
            document.getElementById("demo3").innerHTML = localStorage.getItem("age");
            document.getElementById("demo4").innerHTML = localStorage.getItem("address");
        }
    </script>
</body>
</html>
