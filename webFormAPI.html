<!-- Here we are using document object which is also called as DOM.
    for every element in the html document is the default object.
    if we want to access, assign, modify the elements by using document object. 
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form API</title>
</head>
<body>
    <p>Enter some number and click on OK</p>
    <input id="id1" type="number" min="50" max="500" required>
    <button onclick="formAPI()">OK</button>
    <p>If the input is less than 50 or greater than 500, error is displayed.</p>
    <p id="demo"></p>
    <script>
        function formAPI() {
        const element = document.getElementById("id1");     //it takes id of p element to display some msg.
            if (!element.checkValidity()) {                 //it checks whether the input is in range or not.(50 to 500)
                document.getElementById("demo").innerHTML = element.validationMessage;      //we assign validationMessage contains some msg if the validation is false.
            } else {
                document.getElementById("demo").innerHTML = "Valid Input";      //we assign some msg if the validation is true.
            }
        }
    </script>
</body>
</html>
